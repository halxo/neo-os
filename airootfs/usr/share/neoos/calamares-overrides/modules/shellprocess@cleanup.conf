---
script:
  # Remove ArchISO/live-only services
  - "rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/livecd-talk.service"
  - "rm -f /etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/sshd.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/vboxservice.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/vmtoolsd.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/vmware-vmblock-fuse.service"

  # Remove live SDDM autologin
  - "rm -f /etc/sddm.conf.d/autologin.conf"

  # Remove NeoOS live-user configuration
  - "rm -f /usr/lib/sysusers.d/neoos-live.conf"
  - "rm -f /usr/lib/tmpfiles.d/neoos-live.conf"
  - "userdel -r neo || true"
  - "rm -f /var/lib/neo/repositories-initialized"

  # Remove ArchISO-specific mkinitcpio configuration
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"

  # The network installation already has the normal kernel preset.
  - "plymouth-set-default-theme neoos"
  # Remove the installer from the installed system
  - "pacman -R --noconfirm calamares || true"
  # Remove live-session crash and coredump data
  - "rm -rf /var/lib/systemd/coredump/* || true"
  - "rm -rf /var/lib/coredump/* || true"
  - "rm -rf /var/crash/* || true"
