# Build-only configuration. tools/build-iso generates the local repository URL.
[options]
Architecture = auto
HoldPkg = pacman glibc
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[neoos]
SigLevel = Optional TrustAll
Server = https://halxo.github.io/neo-os/repo/$arch


[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[cachyos]
Server = https://build.cachyos.org/repo/x86_64/cachyos

